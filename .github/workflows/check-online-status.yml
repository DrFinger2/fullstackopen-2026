name: Check online status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check website
        id: status
        run: |
          if curl -fsS --max-time 30 https://fullstackopen-2026-okiy.onrender.com > /dev/null; then
            echo "status=🟢 Online" >> "$GITHUB_OUTPUT"
          else
            echo "status=🔴 Offline" >> "$GITHUB_OUTPUT"
          fi

      - name: Update README
        env:
          STATUS: ${{ steps.status.outputs.status }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import os

          path = Path("osa3/README.md")
          text = path.read_text()

          start = "<!-- WEBSITE_STATUS_START -->"
          end = "<!-- WEBSITE_STATUS_END -->"

          status = os.environ["STATUS"]
          time = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          new = f"""{start}
          **Status:** {status}

          **Last checked:** {time}
          {end}"""

          a = text.index(start)
          b = text.index(end) + len(end)

          path.write_text(text[:a] + new + text[b:])
          PY

      - name: Save README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add osa3/README.md
          git diff --cached --quiet || (git commit -m "Update online status" && git push)